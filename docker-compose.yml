services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: student-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_os
      POSTGRES_USER: student_os
      POSTGRES_PASSWORD: change_me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

